<body  data-bs-spy="scroll" data-bs-target="#list-example" data-bs-smooth-scroll="true" tabindex="0">

 <nav class="navbar navbar-expand-lg custom-navbar">

<div class="container my-5" style="color: rgb(63, 97, 29);">
<h1 style="color: rgb(109, 168, 51);"><i class="fa fa-search"></i>Start Log Scanning</h1>
<form id="uploadForm">

  <div class="mb-3">

</ul>

<div class="container my-5" style="color: rgb(63, 97, 29);">
<h1 style="color: rgb(109, 168, 51);"><i class="fa fa-search"></i>Start Port Scanning</h1>
<form id="ipInputForm">

  <div class="mb-3">
    <label style="color: blue;" class="form-label">Type the ip address:</label>
    <input style="color: chocolate;" type="text" id="ipInput" class="form-control" >
  </div>

  <button style="background-color: rgb(76, 94, 49);" type="submit" class="btn btn-primary">
    <i class="fa fa-search"></i> SCAN
  </button>

</form>
<div style="margin-top: 50px;" class="mb-3">
<code style="color: red;">Scan Results:</code>
<ul id="ul2">
  
</ul>
</div>


</div> 


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 120; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 0.6,
        vy: (Math.random() - 0.5) * 0.6,
        size: Math.random() * 2 + 1
    });
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "rgba(0,0,0,0.55)";

    particles.forEach(p => {
        ctx.fillRect(p.x, p.y, p.size, p.size);
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
    });

    for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
            let dx = particles[i].x - particles[j].x;
            let dy = particles[i].y - particles[j].y;
            let dist = Math.sqrt(dx * dx + dy * dy);

            if (dist < 180) {
                let alpha = 1 - dist / 180;
                ctx.strokeStyle = `rgba(0,500,0,${alpha * 0.30})`;
                ctx.lineWidth = 1.1;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
            }
        }
    }
    requestAnimationFrame(animate);
}
animate();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

<!-- BACKEND CALL -->
<script>

const ul2 = document.getElementById("ul2");

document.getElementById("ipInputForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const ip = document.getElementById("ipInput").value.trim();
    ul2.innerHTML = "<li style='color:yellow'>scanning..</li>";

    fetch(`http://localhost:8080/api/siem/portScan?data=${ip}`, {
        method: "GET"
    })
    .then(res => res.json())
    .then(data => {
        ul2.innerHTML = "";

        data.forEach(item => {
            let li = document.createElement("li");
            
            let bannerText = item.banner ? ` - Banner: ${item.banner}` : "";
            li.textContent = `Port: ${item.port} - State: ${item.state}${bannerText}`;
            li.style.color = item.state === "OPEN" ? "lime" : "gray";
            ul2.appendChild(li);
        });
    })
    .catch(err => {
        ul2.innerHTML = `<li style='color:orange'>Greška: ${err.message}</li>`;
        console.error(err);
    });
});
  

document.getElementById("uploadForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const fileInput = document.getElementById("fileInput");
    const file = fileInput.files[0];

    if (!file) {
        alert("Select your file first!");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    fetch("http://localhost:8080/api/siem/upload", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
    
        ul1.innerHTML = "";

        data.forEach(alert => {
            let li = document.createElement('li');
            li.textContent = `${alert.type} - ${alert.message} (IP: ${alert.ip})`;
            ul1.appendChild(li);
        });

    })
    .catch(err => console.error(err));
});

</script>

</body>
</html>
